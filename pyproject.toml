[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docubrief-api"
version = "0.1.0"
description = "API and asynchronous document processing for DocuBrief"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chardet>=5.2,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "Pillow>=10.4,<12",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "supabase>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "vercel-queue>=0.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7"]
local-worker = ["celery[redis]>=5.4,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[[tool.vercel.subscribers]]
entrypoint = "app.workers.vercel_worker:process_document_message"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
